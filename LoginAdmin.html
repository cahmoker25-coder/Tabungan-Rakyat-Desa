<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Khusus Pengurus - Tabungan Rakyat</title>
  <!-- Diarahkan langsung ke Style.css (Persiapan gabung CSS) -->
  <link rel="stylesheet" href="Style.css">
  <style>
    /* Styling Tambahan Khusus Portal Admin agar Kelihatan Enterprise */
    .admin-header-icon {
      text-align: center;
      margin-bottom: 12px;
    }
    .admin-icon-glow {
      font-size: 38px;
      display: inline-block;
      filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.6));
    }
    .badge-restricted {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      animation: pulseDot 1.5s infinite;
    }
    @keyframes pulseDot {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }
    .security-notice {
      margin-top: 20px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      border-left: 3px solid #f59e0b;
      font-size: 10px;
      color: #94a3b8;
      text-align: left;
      line-height: 1.4;
    }
  </style>
</head>
<body class="login-page">

  <!-- Background Ornamen Glassmorphism khusus Admin -->
  <div class="circle circle-admin-1"></div>
  <div class="circle circle-admin-2"></div>

  <div class="container">
    <div class="glass-card" style="border-color: rgba(245, 158, 11, 0.3);">
      
      <!-- Icon Shield Enterprise -->
      <div class="admin-header-icon">
        <span class="admin-icon-glow">🛡️</span>
      </div>

      <div style="text-align: center;">
        <div class="badge-restricted">
          <span class="status-dot"></span> Restricted Area
        </div>
        <h2>Portal Otoritas Admin</h2>
        <p class="subtitle" style="margin-bottom: 20px;">Silakan otentikasi kunci akses bendahara / pengelola</p>
      </div>

      <!-- FORM LOGIN ADMIN -->
      <form id="form-admin-login" onsubmit="return handleAdminLogin(event)">
        
        <div class="input-group">
          <label>ID Administrator / Username</label>
          <input type="text" id="admin-username" placeholder="Masukkan ID Pengurus" autocomplete="off" required>
        </div>

        <div class="input-group">
          <label>Sandi Akses Otoritas</label>
          <div class="password-wrapper">
            <input type="password" id="admin-password" placeholder="Masukkan Sandi Keamanan" required>
            <span class="toggle-eye" onclick="togglePassword('admin-password', this)">👁️</span>
          </div>
        </div>

        <button type="submit" class="btn-glass" style="background: linear-gradient(135deg, #d97706, #b45309); margin-top: 15px;">
          🔓 Autentikasi & Masuk Dashboard
        </button>
      </form>
      
      <!-- ... sisa elemen lainnya ... -->

  <!-- Firebase SDK v8 CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Script.js Master Utama -->
  <script src="Script.js"></script>
</body>
</html>


      <!-- Catatan Keamanan -->

      <div class="links">

      </div>

    </div>
  </div>
